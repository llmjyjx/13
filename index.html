<script>

const images = Array.from(
  { length: 49 },
  (_, i) => `./img/1 (${i + 1}).jpg`
);

function shuffle(array){

  const result = [...array];

  for(
    let i = result.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      result[i],
      result[j]
    ] =
    [
      result[j],
      result[i]
    ];

  }

  return result;

}

const randomImages =
  shuffle(images);

const slides =
  document.getElementById("slides");

const prev =
  document.getElementById("prev");

const next =
  document.getElementById("next");

randomImages.forEach(
  (src, index) => {

    const figure =
      document.createElement("figure");

    figure.className =
      "slide" +
      (
        index === 0
          ? " active"
          : ""
      );

    const img =
      document.createElement("img");

    img.src =
      src;

    const match =
      src.match(/\((\d+)\)/);

    const number =
      match
        ? match[1]
        : index + 1;

    img.alt =
      `洛阳麓道十三舍 LUDAO HOTEL 酒店环境照片 ${number}`;

    img.loading =
      index === 0
        ? "eager"
        : "lazy";

    img.decoding =
      "async";

    figure.appendChild(img);

    slides.appendChild(figure);

  }
);

const slideEls =
  [
    ...document.querySelectorAll(".slide")
  ];

let current = 0;

let timer = null;

const interval = 5000;

function showSlide(index){

  if(
    slideEls.length === 0
  ){

    return;

  }

  current =
    (
      index +
      slideEls.length
    )
    %
    slideEls.length;

  slideEls.forEach(
    (slide, i) => {

      slide.classList.toggle(
        "active",
        i === current
      );

    }
  );

}

function showRandomSlide(){

  if(
    slideEls.length <= 1
  ){

    return;

  }

  let nextIndex;

  do{

    nextIndex =
      Math.floor(
        Math.random() *
        slideEls.length
      );

  }
  while(
    nextIndex === current
  );

  showSlide(
    nextIndex
  );

}

function startAutoPlay(){

  stopAutoPlay();

  timer =
    setInterval(
      () => {

        showRandomSlide();

      },
      interval
    );

}

function stopAutoPlay(){

  if(
    timer !== null
  ){

    clearInterval(timer);

    timer = null;

  }

}

prev.addEventListener(
  "click",
  () => {

    showRandomSlide();

    startAutoPlay();

  }
);

next.addEventListener(
  "click",
  () => {

    showRandomSlide();

    startAutoPlay();

  }
);

const hero =
  document.querySelector(".hero");

hero.addEventListener(
  "mouseenter",
  () => {

    stopAutoPlay();

  }
);

hero.addEventListener(
  "mouseleave",
  () => {

    startAutoPlay();

  }
);

let touchX = 0;

let touchY = 0;

hero.addEventListener(
  "touchstart",
  event => {

    const touch =
      event.changedTouches[0];

    touchX =
      touch.clientX;

    touchY =
      touch.clientY;

    stopAutoPlay();

  },
  {
    passive:true
  }
);

hero.addEventListener(
  "touchend",
  event => {

    const touch =
      event.changedTouches[0];

    const dx =
      touch.clientX -
      touchX;

    const dy =
      touch.clientY -
      touchY;

    if(
      Math.abs(dx) > 45 &&
      Math.abs(dx) > Math.abs(dy)
    ){

      showRandomSlide();

    }

    startAutoPlay();

  },
  {
    passive:true
  }
);

startAutoPlay();

</script>
