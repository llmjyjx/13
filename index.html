<body>

<main class="hero" aria-label="洛阳麓道十三舍 LUDAO HOTEL 酒店图片轮播">

  <!-- 固定品牌：直接叠加在轮播图上，无背景 -->

<script>
/*
 * 图片来自用户指定的携程/猫途鹰酒店公开展示页。
 * 正式商业部署前，建议确认酒店对图片拥有使用权，并将授权图片放到自己的 CDN/服务器。
 */
<!-- const images = [ -->
  <!-- "https://dimg04.c-ctrip.com/images//1mc5o12000hsz8qch2D81_R_1080_808_Q90.jpg", -->
  <!-- "https://dimg04.c-ctrip.com/images//1mc3312000hszagwh8462_R_1080_808_Q90.jpg", -->
  <!-- "https://dimg04.c-ctrip.com/images//0205112000633j4txFFBE_R_1080_808_Q90.jpg", -->
  <!-- "https://dimg04.c-ctrip.com/images//1mc4s12000hszhvyk2168_R_1080_808_Q90.jpg", -->
  <!-- "https://dimg04.c-ctrip.com/images//1mc2g12000hszezl40A73_R_1080_808_Q90.jpg", -->
  <!-- "https://dimg04.c-ctrip.com/images//1mc0512000hszey955700_R_1080_808_Q90.jpg", -->
  <!-- "https://dimg04.c-ctrip.com/images//1mc5r12000hszhz92D229_R_1080_808_Q90.jpg", -->
  <!-- "https://dimg04.c-ctrip.com/images//1mc1d12000hszicsc8929_R_1080_808_Q90.jpg", -->
  <!-- "https://dimg04.c-ctrip.com/images//1mc5v12000hsziayj332E_R_1080_808_Q90.jpg", -->
  <!-- "https://dimg04.c-ctrip.com/images//1mc0812000hszioedE88D_R_1080_808_Q90.jpg" -->
<!-- ]; -->
const images = Array.from(
  { length: 52 },
  (_, i) => `./img/1 (${i + 1}).jpg`
);

const slides = document.getElementById("slides");
const counter = document.getElementById("counter");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

images.forEach((src, index) => {
  const figure = document.createElement("figure");
  figure.className = "slide" + (index === 0 ? " active" : "");

  const img = document.createElement("img");
  img.src = src;
  img.alt = "洛阳麓道十三舍酒店照片 " + (index + 1);
  img.loading = index === 0 ? "eager" : "lazy";
  img.decoding = "async";

  figure.appendChild(img);
  slides.appendChild(figure);
});

const slideEls = [...document.querySelectorAll(".slide")];
let current = 0;
let timer = null;
const interval = 5000;

function updateCounter(){
  counter.textContent =
    String(current + 1).padStart(2, "0") +
    " / " +
    String(slideEls.length).padStart(2, "0");
}

function showSlide(index){
  current = (index + slideEls.length) % slideEls.length;

  slideEls.forEach((slide, i) => {
    slide.classList.toggle("active", i === current);
  });

  updateCounter();
}

function startAutoPlay(){
  stopAutoPlay();
  timer = setInterval(() => {
    showSlide(current + 1);
  }, interval);
}

function stopAutoPlay(){
  if(timer){
    clearInterval(timer);
    timer = null;
  }
}

prev.addEventListener("click", () => {
  showSlide(current - 1);
  startAutoPlay();
});

next.addEventListener("click", () => {
  showSlide(current + 1);
  startAutoPlay();
});

/* 鼠标悬停暂停 */
const hero = document.querySelector(".hero");

hero.addEventListener("mouseenter", stopAutoPlay);
hero.addEventListener("mouseleave", startAutoPlay);

/* 移动端左右滑动 */
let touchX = 0;
let touchY = 0;

hero.addEventListener("touchstart", event => {
  const touch = event.changedTouches[0];
  touchX = touch.clientX;
  touchY = touch.clientY;
  stopAutoPlay();
}, {passive:true});

hero.addEventListener("touchend", event => {
  const touch = event.changedTouches[0];
  const dx = touch.clientX - touchX;
  const dy = touch.clientY - touchY;

  if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)){
    showSlide(current + (dx < 0 ? 1 : -1));
  }

  startAutoPlay();
}, {passive:true});

updateCounter();
startAutoPlay();
</script>
