<script>
const images = Array.from(
  { length: 49 },
  (_, i) => `./img/1 (${i + 1}).jpg`
);
function shuffle(array) {
  const result = [...array];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}
const randomImages = shuffle(images);
const slides = document.getElementById("slides");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
const bgm = document.getElementById("bgm");
const brand = document.getElementById("brand");
const hero = document.querySelector(".hero");
// 创建所有 slide
const slideEls = [];
const loadedIndexes = new Set();
randomImages.forEach((src, index) => {
  const figure = document.createElement("figure");
  figure.className = "slide" + (index === 0 ? " active" : "");
  const img = document.createElement("img");
  img.src = src;
  img.alt = `洛阳麓道十三舍 LUDAO HOTEL 酒店环境照片 ${index + 1}`;
  img.decoding = "async";
  img.loading = index === 0 ? "eager" : "lazy";
  img.onload = () => loadedIndexes.add(index);
  if (img.complete) loadedIndexes.add(index);
  figure.appendChild(img);
  slides.appendChild(figure);
  slideEls.push(figure);
});
let current = 0;
let timer = null;
const interval = 4500;
function showSlide(index) {
  if (slideEls.length === 0) return;
  current = (index + slideEls.length) % slideEls.length;
  slideEls.forEach((slide, i) => {
    slide.classList.toggle("active", i === current);
  });
}
function showRandomSlide() {
  const ready = [...loadedIndexes].filter(i => i !== current);
  if (ready.length === 0) return;
  const nextIndex = ready[Math.floor(Math.random() * ready.length)];
  showSlide(nextIndex);
}
function startAutoPlay() {
  stopAutoPlay();
  timer = setInterval(showRandomSlide, interval);
}
function stopAutoPlay() {
  if (timer !== null) {
    clearInterval(timer);
    timer = null;
  }
}
function preloadImages() {
  randomImages.forEach((src, index) => {
    if (index === 0) return;
    const img = new Image();
    img.src = src;
    img.onload = () => loadedIndexes.add(index);
    if (img.complete) loadedIndexes.add(index);
  });
}
if ("requestIdleCallback" in window) {
  requestIdleCallback(preloadImages, { timeout: 2000 });
} else {
  setTimeout(preloadImages, 800);
}
// ========== 随机 BGM ==========
const musicList = Array.from(
  { length: 4 },
  (_, i) => `./bgm/1 (${i + 1}).mp3`
);
let bgmStarted = false;
let isPlaying = false;
let fadeTimer = null;
function getRandomMusic() {
  return musicList[Math.floor(Math.random() * musicList.length)];
}
function getRandomStartTime() {
  return 50 + Math.random() * 100; // 50~150秒
}
// 6秒渐强：0 → 0.3
function fadeInVolume(duration = 6000, targetVolume = 0.3) {
  if (fadeTimer) {
    clearInterval(fadeTimer);
    fadeTimer = null;
  }
  bgm.volume = 0;
  const start = performance.now();
  fadeTimer = setInterval(() => {
    const elapsed = performance.now() - start;
    const progress = Math.min(elapsed / duration, 1);
    bgm.volume = progress * targetVolume;
    if (progress >= 1) {
      clearInterval(fadeTimer);
      fadeTimer = null;
      bgm.volume = targetVolume;
    }
  }, 30);
}
function playRandomBgm() {
  if (!bgm) return;
  const src = getRandomMusic();
  const startTime = getRandomStartTime();
  bgm.src = src;
  bgm.load();
  const onCanPlay = () => {
    bgm.removeEventListener("canplay", onCanPlay);
    const maxStart = Math.max(0, (bgm.duration || 200) - 10);
    bgm.currentTime = Math.min(startTime, maxStart);
    bgm.play().then(() => {
      bgmStarted = true;
      isPlaying = true;
      fadeInVolume(6000, 0.3); // 6秒渐强到 30%
    }).catch(() => {});
  };
  bgm.addEventListener("canplay", onCanPlay);
}
function tryPlayBgm() {
  if (bgmStarted && isPlaying) return;
  if (bgmStarted && !isPlaying) {
    // 已加载过，直接恢复播放 + 渐强
    bgm.play().then(() => {
      isPlaying = true;
      fadeInVolume(6000, 0.3);
    }).catch(() => {});
    return;
  }
  playRandomBgm();
}
function toggleBgm() {
  if (!bgm) return;
  if (isPlaying) {
    bgm.pause();
    isPlaying = false;
    if (fadeTimer) {
      clearInterval(fadeTimer);
      fadeTimer = null;
    }
    bgm.volume = 0; // 暂停后重置音量
  } else {
    tryPlayBgm();
  }
}
// 歌曲结束后自动换下一首
bgm.addEventListener("ended", () => {
  bgmStarted = false;
  isPlaying = false;
  if (fadeTimer) {
    clearInterval(fadeTimer);
    fadeTimer = null;
  }
  playRandomBgm();
});
// ========== 抖音爱心效果 ==========
const heartSymbols = ["❤", "❤️", "💕", "💗", "💖"];
function createHeart(x, y) {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
  heart.style.left = x + "px";
  heart.style.top = y + "px";
  // 轻微随机偏移
  heart.style.marginLeft = (Math.random() * 20 - 10) + "px";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 1100);
}
// 判断点是否在 brand 区域内
function isInsideBrand(x, y) {
  const rect = brand.getBoundingClientRect();
  return (
    x >= rect.left &&
    x <= rect.right &&
    y >= rect.top &&
    y <= rect.bottom
  );
}
let isTouching = false;
let lastHeartTime = 0;
function handleHeart(x, y) {
  if (isInsideBrand(x, y)) return; // 标题区域内不生成爱心
  const now = Date.now();
  if (now - lastHeartTime < 80) return; // 控制频率
  lastHeartTime = now;
  createHeart(x, y);
}
// 鼠标按住滑动出爱心
hero.addEventListener("mousedown", (e) => {
  if (e.target.closest(".brand") || e.target.closest(".booking") || e.target.closest(".arrow") || e.target.closest(".credit")) return;
  isTouching = true;
  handleHeart(e.clientX, e.clientY);
});
hero.addEventListener("mousemove", (e) => {
  if (!isTouching) return;
  handleHeart(e.clientX, e.clientY);
});
document.addEventListener("mouseup", () => {
  isTouching = false;
});
// 触摸连续出爱心
hero.addEventListener("touchstart", (e) => {
  if (e.target.closest(".brand") || e.target.closest(".booking") || e.target.closest(".arrow") || e.target.closest(".credit")) return;
  isTouching = true;
  const touch = e.touches[0];
  handleHeart(touch.clientX, touch.clientY);
}, { passive: true });
hero.addEventListener("touchmove", (e) => {
  if (!isTouching) return;
  const touch = e.touches[0];
  handleHeart(touch.clientX, touch.clientY);
}, { passive: true });
hero.addEventListener("touchend", () => {
  isTouching = false;
});
// 按钮事件 —— 仅切换图片，不控制音乐
prev.addEventListener("click", () => {
  showRandomSlide();
  startAutoPlay();
});
next.addEventListener("click", () => {
  showRandomSlide();
  startAutoPlay();
});
// 标题双击：播放 / 暂停
brand.addEventListener("dblclick", (e) => {
  e.preventDefault();
  e.stopPropagation();
  toggleBgm();
});
// 鼠标悬停暂停轮播
hero.addEventListener("mouseenter", stopAutoPlay);
hero.addEventListener("mouseleave", startAutoPlay);
// 触摸滑动切换图片（不再触发播放）
let touchX = 0;
let touchY = 0;
hero.addEventListener("touchstart", (event) => {
  const touch = event.changedTouches[0];
  touchX = touch.clientX;
  touchY = touch.clientY;
  stopAutoPlay();
}, { passive: true });
hero.addEventListener("touchend", (event) => {
  const touch = event.changedTouches[0];
  const dx = touch.clientX - touchX;
  const dy = touch.clientY - touchY;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
    showRandomSlide();
  }
  startAutoPlay();
}, { passive: true });
