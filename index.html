<script>
const images = Array.from(
  { length: 49 },
  (_, i) => `./img/1 (${i + 1}).jpg`
);
function shuffle(array) {
  const result = [...array];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}
const randomImages = shuffle(images);
const slides = document.getElementById("slides");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
const bgm = document.getElementById("bgm");
// 创建所有 slide（先不显示）
const slideEls = [];
const loadedIndexes = new Set(); // 已加载完成的索引
randomImages.forEach((src, index) => {
  const figure = document.createElement("figure");
  figure.className = "slide" + (index === 0 ? " active" : "");
  const img = document.createElement("img");
  img.src = src;
  img.alt = `洛阳麓道十三舍 LUDAO HOTEL 酒店环境照片 ${index + 1}`;
  img.decoding = "async";
  // 第一张优先加载，其余先懒加载，后面再预加载
  img.loading = index === 0 ? "eager" : "lazy";
  // 记录加载完成
  img.onload = () => {
    loadedIndexes.add(index);
  };
  // 已经缓存的情况
  if (img.complete) {
    loadedIndexes.add(index);
  }
  figure.appendChild(img);
  slides.appendChild(figure);
  slideEls.push(figure);
});
let current = 0;
let timer = null;
const interval = 4500;
function showSlide(index) {
  if (slideEls.length === 0) return;
  current = (index + slideEls.length) % slideEls.length;
  slideEls.forEach((slide, i) => {
    slide.classList.toggle("active", i === current);
  });
}
// 只从已加载完成的图片中随机选
function showRandomSlide() {
  const ready = [...loadedIndexes].filter(i => i !== current);
  // 如果暂时没有其他已加载的图，就保持当前
  if (ready.length === 0) return;
  const nextIndex = ready[Math.floor(Math.random() * ready.length)];
  showSlide(nextIndex);
}
function startAutoPlay() {
  stopAutoPlay();
  timer = setInterval(() => {
    showRandomSlide();
  }, interval);
}
function stopAutoPlay() {
  if (timer !== null) {
    clearInterval(timer);
    timer = null;
  }
}
// ========== 预加载核心 ==========
function preloadImages() {
  // 从第 2 张开始后台预加载
  randomImages.forEach((src, index) => {
    if (index === 0) return;
    const img = new Image();
    img.src = src;
    img.onload = () => {
      loadedIndexes.add(index);
    };
    // 已缓存
    if (img.complete) {
      loadedIndexes.add(index);
    }
  });
}
// 页面空闲时再预加载，减少首屏压力
if ("requestIdleCallback" in window) {
  requestIdleCallback(preloadImages, { timeout: 2000 });
} else {
  setTimeout(preloadImages, 800);
}
// ========== BGM 播放逻辑 ==========
let bgmStarted = false;
function tryPlayBgm() {
  if (bgmStarted || !bgm) return;
  const playPromise = bgm.play();
  if (playPromise !== undefined) {
    playPromise
      .then(() => {
        bgmStarted = true;
      })
      .catch(() => {
        // 自动播放被拦截，等待用户交互
      });
  }
}
// 尝试自动播放
tryPlayBgm();
// 任意用户交互后启动 BGM
function onFirstInteraction() {
  tryPlayBgm();
  document.removeEventListener("click", onFirstInteraction);
  document.removeEventListener("touchstart", onFirstInteraction);
  document.removeEventListener("keydown", onFirstInteraction);
}
document.addEventListener("click", onFirstInteraction, { once: true });
document.addEventListener("touchstart", onFirstInteraction, { once: true, passive: true });
document.addEventListener("keydown", onFirstInteraction, { once: true });
// 按钮事件
prev.addEventListener("click", () => {
  showRandomSlide();
  startAutoPlay();
  tryPlayBgm();
});
next.addEventListener("click", () => {
  showRandomSlide();
  startAutoPlay();
  tryPlayBgm();
});
// 鼠标悬停暂停
const hero = document.querySelector(".hero");
hero.addEventListener("mouseenter", stopAutoPlay);
hero.addEventListener("mouseleave", startAutoPlay);
// 触摸滑动
let touchX = 0;
let touchY = 0;
hero.addEventListener("touchstart", (event) => {
  const touch = event.changedTouches[0];
  touchX = touch.clientX;
  touchY = touch.clientY;
  stopAutoPlay();
}, { passive: true });
hero.addEventListener("touchend", (event) => {
  const touch = event.changedTouches[0];
  const dx = touch.clientX - touchX;
  const dy = touch.clientY - touchY;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
    showRandomSlide();
  }
  startAutoPlay();
  tryPlayBgm();
}, { passive: true });
// 启动
startAutoPlay();
</script>
